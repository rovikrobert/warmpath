[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
igno[RESEND_KEY_REDACTED] = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy models use string-based forward references in relationship() type hints.
# These are resolved at runtime by SQLAlchemy, not by Python's type system.
"app/models/*.py" = ["F821"]
