[build]
dockerfilePath = "Dockerfile"
watchPatterns = ["app/**", "frontend/**", "alembic/**", "scripts/**", "requirements.txt", "Dockerfile", "railway.toml", ".dockerignore"]

[deploy]
startCommand = "exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
