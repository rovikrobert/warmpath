name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            requirements*.lock

      - name: Install dependencies
        run: uv pip install --system -r requirements-test.txt

      - name: Run tests
        run: pytest -n auto --timeout=120 -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath
        with:
          cache: pip
          cache-dependency-path: requirements-lint.txt

      - name: Install ruff
        run: pip install -r requirements-lint.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Check lint rules
        # 107 pre-existing issues — warn only until codebase is cleaned up
        continue-on-error: true
        run: ruff check .

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - name: Run security scanner
        # stdlib-only script — if it ever imports project code, add: pip install -r requirements.txt
        # Exit codes: 0=clean, 1=findings, 2=critical — only block on critical
        run: |
          python -m scripts.security_scan || code=$?
          if [ "${code:-0}" -eq 2 ]; then exit 2; fi

  privacy-scan:
    name: Privacy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - name: Run privacy scanner
        # stdlib-only script — if it ever imports project code, add: pip install -r requirements.txt
        # Exit codes: 0=compliant, 1=findings, 2=critical — only block on critical
        run: |
          python -m scripts.privacy_scan || code=$?
          if [ "${code:-0}" -eq 2 ]; then exit 2; fi

  n-plus-one-check:
    name: N+1 Query Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - name: Check for N+1 query patterns
        run: python -m scripts.check_n_plus_one

  dep-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            requirements*.lock

      - name: Install pip-audit
        run: uv pip install --system pip-audit==2.9.0

      - name: Audit dependencies
        # GHSA-w8v5-vhqr-4h9v: diskcache pickle deserialization (transitive via weave).
        #   Local-only (CVSS 5.2), no fix version available. Revisit when diskcache >5.6.3 ships.
        # GHSA-7mpr-5m44-h73r: markdownify memory DoS via large HTML headlines.
        #   Unfixable: python-jobspy pins markdownify<0.14.0. Low risk — internal job scraping only.
        run: pip-audit -r requirements.txt --ignore-vuln GHSA-w8v5-vhqr-4h9v --ignore-vuln GHSA-7mpr-5m44-h73r

  async-lint:
    name: Async/Sync Misuse Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - name: Check for async/sync connection misuse
        # stdlib-only script (uses ast module) — no pip install needed
        # Exit codes: 0=clean, 1=findings — block on any finding
        run: python -m scripts.async_lint

  agent-config-check:
    name: Agent Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - name: Validate agent scan targets
        run: python3 scripts/validate_agent_targets.py

  telemetry-scan:
    name: Scope Telemetry Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - name: Verify Phase 3 scope telemetry sequence
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          if [ -z "${POSTHOG_API_KEY}" ] || [ -z "${POSTHOG_PROJECT_ID}" ]; then
            echo "Skipping scope telemetry verification: POSTHOG_API_KEY/POSTHOG_PROJECT_ID not configured."
            exit 0
          fi
          python3 scripts/verify_scope_telemetry.py --days 7 --limit 200

  lock-freshness:
    name: Lock Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-warmpath

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements*.txt
            requirements*.lock

      - name: Verify requirements-test.lock is fresh
        run: make lock-check
