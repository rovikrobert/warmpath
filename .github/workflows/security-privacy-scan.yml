name: Security & Privacy Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Daily at 06:00 UTC (14:00 SGT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Security scanner
        run: python -m scripts.security_scan || true

      - name: Run Security scanner (JSON for artifacts)
        run: python -m scripts.security_scan --json > security-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: security-report.json

  privacy-scan:
    name: Privacy Compliance Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Privy scanner
        run: python -m scripts.privacy_scan || true

      - name: Run Privy scanner (JSON for artifacts)
        run: python -m scripts.privacy_scan --json > privacy-report.json || true

      - name: Upload privacy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-report
          path: privacy-report.json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --output pip-audit-report.json --format json || true

      - name: Display results
        run: pip-audit -r requirements.txt || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
