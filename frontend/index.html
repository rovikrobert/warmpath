    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "WarmPath",
      "legalName": "Majiq Pte Ltd",
      "url": "https://warmpath.majiq.agency",
      "logo": "https://warmpath.majiq.agency/og-image.png",
      "description": "AI-powered referral marketplace connecting job seekers with employees at target companies for warm introductions.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "SG"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "rovik@majiq.agency",
        "contactType": "customer support"
      }
    }
    </script>

    <!-- JSON-LD: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "WarmPath",
      "url": "https://warmpath.majiq.agency",
      "applicationCategory": "BusinessApplication",
      "description": "AI-powered referral marketplace that helps job seekers get employee referrals instead of applying cold. Matches across 36+ data signals including relationship strength, role relevance, and cultural context.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free for network holders. Job seekers pay $20-30/month for marketplace access."
      },
      "featureList": [
        "AI-powered Connection Score ranking (0-100) based on recency, relationship strength, role relevance, and tenure",
        "Privacy-first anonymized marketplace — contact identity revealed only after network holder approval",
        "Cultural context engine adapting intro messages to location, company culture, and relationship type",
        "LinkedIn CSV import with automatic contact enrichment",
        "Credit-based economy rewarding network holders for facilitating referrals",
        "Multi-step referral messaging with tone and channel optimization"
      ],
      "operatingSystem": "Web browser"
    }
    </script>

    <!-- JSON-LD: FAQPage (AEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do employee referrals compare to cold applications?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Employee referrals convert at 10-40% compared to 1-3% for cold applications, according to industry hiring data. Referred candidates are also hired 55% faster and tend to stay longer. WarmPath helps job seekers access referral networks at companies they want to work at."
          }
        },
        {
          "@type": "Question",
          "name": "What is WarmPath?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "WarmPath is an AI-powered referral marketplace that connects job seekers with employees at their target companies. Instead of applying cold, job seekers search an anonymized marketplace of professional networks and request warm introductions through network holders who can refer them internally."
          }
        },
        {
          "@type": "Question",
          "name": "How does WarmPath protect contact privacy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "WarmPath uses a privacy-first architecture with anonymized marketplace listings that show only company, role level, and department — never names or contact details. Contact identity is revealed only when the network holder explicitly approves an intro request. Contacts can also request removal via a global suppression list."
          }
        },
        {
          "@type": "Question",
          "name": "How much does WarmPath cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "WarmPath is free for network holders who upload their connections. Job seekers can search their own uploaded contacts for free, and pay $20-30 per month for marketplace access to search other people's networks at target companies. Credits can also be purchased individually at $1 for 5 credits."
          }
        },
        {
          "@type": "Question",
          "name": "What is a Connection Score?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Connection Score is WarmPath's AI-generated 0-100 ranking that predicts how likely a contact is to provide a successful referral. It weighs recency of interaction (35%), relationship strength (30%), role relevance (20%), and company tenure (15%). Peers and former managers score highest because they are most likely to actually refer you."
          }
        }
      ]
    }
    </script>

    <script>
      (function() {
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(t);
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
